<!DOCTYPE html>
<html>
<head>
    <title>Fullscreen Functionality Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        button { padding: 10px 20px; margin: 10px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .fullscreen-area { background: #f0f0f0; padding: 20px; border: 2px solid #333; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>Fullscreen Functionality Test</h1>
    
    <div class="test-section">
        <h2>Test 1: Browser Fullscreen API</h2>
        <div id="test1-result">Testing...</div>
        <button onclick="testFullscreenAPI()">Test Fullscreen API</button>
    </div>
    
    <div class="test-section">
        <h2>Test 2: Architecture Canvas Component</h2>
        <div id="test2-result">Testing...</div>
        <div id="architecture-canvas-container" class="fullscreen-area">
            <h3>Mock Architecture Canvas</h3>
            <p>This is a test container for the fullscreen functionality.</p>
            <button onclick="toggleFullscreen()">Toggle Fullscreen</button>
            <p id="status">Fullscreen: Not active</p>
        </div>
    </div>
    
    <div class="test-section">
        <h2>Test 3: Server Information</h2>
        <div id="server-info">Loading...</div>
    </div>
    
    <script>
        // Test 1: Browser Fullscreen API
        const test1El = document.getElementById('test1-result');
        const hasRequestFullscreen = typeof document.documentElement.requestFullscreen !== 'undefined';
        const hasExitFullscreen = typeof document.exitFullscreen !== 'undefined';
        const hasFullscreenElement = typeof document.fullscreenElement !== 'undefined';
        
        if (hasRequestFullscreen && hasExitFullscreen && hasFullscreenElement) {
            test1El.innerHTML = '<span class="success">✅ Fullscreen API functions are available in browser</span>';
        } else {
            test1El.innerHTML = '<span class="error">❌ Fullscreen API functions are NOT available in browser</span>';
        }
        
        function testFullscreenAPI() {
            const elem = document.getElementById('architecture-canvas-container');
            if (!document.fullscreenElement) {
                elem.requestFullscreen().then(() => {
                    test1El.innerHTML += '<br><span class="success">✅ Fullscreen API works correctly!</span>';
                }).catch(err => {
                    test1El.innerHTML += '<br><span class="error">❌ Fullscreen API error: ' + err.message + '</span>';
                });
            } else {
                document.exitFullscreen().then(() => {
                    test1El.innerHTML += '<br><span class="success">✅ Exit fullscreen works correctly!</span>';
                });
            }
        }
        
        // Test 2: Architecture Canvas Simulation
        const test2El = document.getElementById('test2-result');
        test2El.innerHTML = '<span class="success">✅ Architecture canvas container found</span>';
        
        function toggleFullscreen() {
            const elem = document.getElementById('architecture-canvas-container');
            if (!document.fullscreenElement) {
                elem.requestFullscreen().then(() => {
                    document.getElementById('status').textContent = 'Fullscreen: Active';
                }).catch(err => {
                    document.getElementById('status').textContent = 'Fullscreen Error: ' + err.message;
                });
            } else {
                document.exitFullscreen().then(() => {
                    document.getElementById('status').textContent = 'Fullscreen: Not active';
                });
            }
        }
        
        // Listen for fullscreen changes
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.getElementById('status').textContent = 'Fullscreen: Not active';
            }
        });
        
        // Test 3: Server info
        fetch('/health')
            .then(response => response.json())
            .then(data => {
                document.getElementById('server-info').innerHTML = `
                    <span class="success">✅ Server is running</span><br>
                    Status: ${data.status}<br>
                    Timestamp: ${new Date(data.timestamp * 1000).toLocaleString()}
                `;
            })
            .catch(err => {
                document.getElementById('server-info').innerHTML = '<span class="error">❌ Cannot reach server</span>';
            });
    </script>
</body>
</html>
