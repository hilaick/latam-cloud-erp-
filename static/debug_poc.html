<!DOCTYPE html>
<html>
<head>
    <title>Debug PoC Projects</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="/static/js/01_data.js"></script>
    <script src="/static/js/05_wizard.js"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        function DebugPoC() {
            const [projects, setProjects] = useState([]);
            const [selectedId, setSelectedId] = useState(null);
            
            useEffect(() => {
                if (typeof defaultProjects !== 'undefined') {
                    setProjects(defaultProjects);
                    console.log('All projects:', defaultProjects);
                }
            }, []);
            
            const selectedProject = projects.find(p => p.id === selectedId);
            
            return (
                <div style={{ padding: '20px', fontFamily: 'monospace' }}>
                    <h1>Debug PoC Projects</h1>
                    
                    <div style={{ display: 'flex', gap: '20px' }}>
                        <div style={{ flex: 1 }}>
                            <h2>All Projects</h2>
                            <table border="1" cellPadding="8" style={{ borderCollapse: 'collapse', width: '100%' }}>
                                <thead>
                                    <tr style={{ background: '#f0f0f0' }}>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Type</th>
                                        <th>Phase</th>
                                        <th>PoC Cap</th>
                                        <th>PoC TTL</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {projects.map(p => (
                                        <tr key={p.id} style={{ background: p.project_type === 'poc' ? '#fff3cd' : 'white' }}>
                                            <td>{p.id}</td>
                                            <td><strong>{p.name}</strong></td>
                                            <td>{p.project_type || 'regular'}</td>
                                            <td>{p.lifecycleState}</td>
                                            <td>{p.pocCap || '-'}</td>
                                            <td>{p.pocTtl || '-'}</td>
                                            <td>
                                                <button 
                                                    onClick={() => setSelectedId(p.id)}
                                                    style={{ padding: '5px 10px', background: '#007bff', color: 'white', border: 'none', borderRadius: '3px', cursor: 'pointer' }}
                                                >
                                                    Select
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                        
                        <div style={{ flex: 1 }}>
                            <h2>Selected Project</h2>
                            {selectedProject ? (
                                <div style={{ background: '#e9ecef', padding: '15px', borderRadius: '5px' }}>
                                    <h3>{selectedProject.name}</h3>
                                    <pre>{JSON.stringify(selectedProject, null, 2)}</pre>
                                    
                                    <div style={{ marginTop: '15px', padding: '10px', background: selectedProject.project_type === 'poc' ? '#d4edda' : '#f8d7da', borderRadius: '5px' }}>
                                        <h4>PoC Detection Test:</h4>
                                        <p><strong>project_type:</strong> {selectedProject.project_type || '(undefined)'}</p>
                                        <p><strong>isPoC = project?.project_type === "poc":</strong> 
                                            <span style={{ color: selectedProject.project_type === 'poc' ? 'green' : 'red', fontWeight: 'bold' }}>
                                                {selectedProject.project_type === 'poc' ? ' ✅ TRUE' : ' ❌ FALSE'}
                                            </span>
                                        </p>
                                        
                                        {selectedProject.project_type === 'poc' && (
                                            <div style={{ marginTop: '10px', padding: '10px', background: '#fff3cd', borderRadius: '3px' }}>
                                                <h4>PoC Features:</h4>
                                                <p>• Should show amber banner: "Fast-Track PoC Lifecycle Active"</p>
                                                <p>• Should have 4 phases (no Post-Live WAR)</p>
                                                <p>• Phase labels: ARB Intake, Architecture, PoC Budgeting, Active Execution</p>
                                                <p>• Budget view: PoCFinOpsView (not BudgetEstimatorView)</p>
                                                <p>• Auto-archive after Execution phase</p>
                                            </div>
                                        )}
                                    </div>
                                    
                                    <div style={{ marginTop: '15px' }}>
                                        <h4>Test ProjectCommandCenter Logic:</h4>
                                        <button 
                                            onClick={() => {
                                                const isPoC = selectedProject?.project_type === "poc";
                                                const states = isPoC 
                                                    ? ['1_arb', '2_architecture', '3_planning', '4_execution']
                                                    : ['1_arb', '2_architecture', '3_planning', '4_execution', '5_postlive'];
                                                alert(`isPoC: ${isPoC}\nPhases: ${states.length} (${states.join(', ')})`);
                                            }}
                                            style={{ padding: '10px 15px', background: '#28a745', color: 'white', border: 'none', borderRadius: '5px', cursor: 'pointer' }}
                                        >
                                            Test PoC Logic
                                        </button>
                                    </div>
                                </div>
                            ) : (
                                <p>Select a project from the list</p>
                            )}
                        </div>
                    </div>
                    
                    <div style={{ marginTop: '20px', padding: '15px', background: '#f8f9fa', borderRadius: '5px' }}>
                        <h3>Browser Console Check:</h3>
                        <p>Open Developer Tools (F12) → Console tab</p>
                        <p>Check for errors like "PhysicsEngineView is not defined" or "ProjectCommandCenter is not defined"</p>
                        <button 
                            onClick={() => console.log('ProjectCommandCenter exists:', typeof ProjectCommandCenter)}
                            style={{ marginRight: '10px', padding: '5px 10px', background: '#6c757d', color: 'white', border: 'none', borderRadius: '3px', cursor: 'pointer' }}
                        >
                            Check ProjectCommandCenter
                        </button>
                        <button 
                            onClick={() => console.log('PhysicsEngineView exists:', typeof PhysicsEngineView)}
                            style={{ padding: '5px 10px', background: '#6c757d', color: 'white', border: 'none', borderRadius: '3px', cursor: 'pointer' }}
                        >
                            Check PhysicsEngineView
                        </button>
                    </div>
                </div>
            );
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(<DebugPoC />);
    </script>
</body>
</html>
