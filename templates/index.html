    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .sidebar-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .step-active { @apply border-blue-600 text-blue-700 bg-blue-50; }
        .step-completed { @apply border-emerald-500 text-emerald-700 bg-emerald-50; }
        .step-pending { @apply border-slate-200 text-slate-400 bg-white; }
        
        .leaflet-container { background: #0f172a; font-family: inherit; z-index: 10; }
        .leaflet-popup-content-wrapper { background: rgba(15, 23, 42, 0.95); color: white; border-radius: 0.75rem; border: 1px solid #334155; backdrop-filter: blur(8px); padding: 0; overflow: hidden;}
        .leaflet-popup-tip { background: rgba(15, 23, 42, 0.95); border: 1px solid #334155; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
