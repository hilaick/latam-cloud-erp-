<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LATAM Cloud Delivery ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .sidebar-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .step-active { @apply border-blue-600 text-blue-700 bg-blue-50; }
        .step-completed { @apply border-emerald-500 text-emerald-700 bg-emerald-50; }
        .step-pending { @apply border-slate-200 text-slate-400 bg-white; }
        
        .leaflet-container { background: #0f172a; font-family: inherit; z-index: 10; }
        .leaflet-popup-content-wrapper { background: rgba(15, 23, 42, 0.95); color: white; border-radius: 0.75rem; border: 1px solid #334155; backdrop-filter: blur(8px); padding: 0; overflow: hidden;}
        .leaflet-popup-tip { background: rgba(15, 23, 42, 0.95); border: 1px solid #334155; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 overflow-hidden text-[11px]">
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // 🛡️ ERROR BOUNDARY (Catches React errors)
        // ==========================================
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null, errorInfo: null };
            }
            
            static getDerivedStateFromError(error) {
                return { hasError: true };
            }
            
            componentDidCatch(error, errorInfo) {
                this.setState({
                    error: error,
                    errorInfo: errorInfo
                });
                console.error("React Error Boundary caught:", error, errorInfo);
            }
            
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-6 bg-rose-50 border border-rose-200 rounded-xl m-4">
                            <h3 className="font-black text-rose-800 mb-2">⚠️ Component Error</h3>
                            <p className="text-sm text-rose-700 mb-3">
                                Something went wrong in this component. The error has been logged.
                            </p>
                            <button 
                                onClick={() => this.setState({ hasError: false })}
                                className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-lg"
                            >
                                Try Again
                            </button>
                            {this.state.error && (
                                <details className="mt-3 text-xs">
                                    <summary className="cursor-pointer text-rose-600 font-bold">Error Details</summary>
                                    <pre className="mt-2 p-3 bg-rose-100 rounded overflow-auto text-rose-800">
                                        {this.state.error.toString()}
                                        {this.state.errorInfo && this.state.errorInfo.componentStack}
                                    </pre>
                                </details>
                            )}
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const { useState, useMemo, useEffect, useRef } = React;

        // ==========================================
        // 📝 GLOBAL DATA STORE & TEMPLATES
        // ==========================================
        const defaultPlaybooks = {
            "default_vm": {
                name: "Standard Generic Migration",
                tasks: [
                    { id: "1", name: "Phase 1: Architecture & Auth", prog: "0%", resp: "", start: "2026-03-01", end: "2026-03-05", isParent: true },
                    { id: "1.1", name: "Provision IAM Service Account & API Keys", prog: "0%", resp: "Partner / Customer", start: "2026-03-01", end: "2026-03-02", isParent: false },
                    { id: "1.2", name: "Deploy Target VPC & Core Network", prog: "0%", resp: "Partner", start: "2026-03-03", end: "2026-03-05", isParent: false },
                    { id: "2", name: "Phase 2: Workload Sync", prog: "0%", resp: "", start: "2026-03-06", end: "2026-03-20", isParent: true },
                    { id: "2.1", name: "Install Agents on Source VMs", prog: "0%", resp: "Customer IT", start: "2026-03-06", end: "2026-03-08", isParent: false },
                    { id: "2.2", name: "Execute Initial Full Block Sync", prog: "0%", resp: "Partner", start: "2026-03-09", end: "2026-03-20", isParent: false }
                ]
            },
            "sap_enterprise_cutover": {
                name: "SAP Enterprise: Cutover & Hypercare",
                tasks: [
                    { id: "1", name: "PHASE 0: PRE-CUTOVER", prog: "0%", resp: "", start: "2026-04-02", end: "2026-04-02", isParent: true },
                    { id: "1.1", name: "Purge & Export Logs/Backups to Cold VM", prog: "0%", resp: "Partner", start: "2026-04-02", end: "2026-04-02", isParent: false },
                    { id: "1.2", name: "Fire Drill: On-Premise DB Restart", prog: "0%", resp: "Partner", start: "2026-04-02", end: "2026-04-02", isParent: false },
                    { id: "1.3", name: "Full On-Premise Backup (Safe Point)", prog: "0%", resp: "Customer IT", start: "2026-04-02", end: "2026-04-02", isParent: false },
                    { id: "2", name: "PHASE 1: CUTOVER (HOLY WEEK)", prog: "0%", resp: "", start: "2026-04-02", end: "2026-04-05", isParent: true },
                    { id: "2.1", name: "Shutdown On-Premise SAP & Network Block", prog: "0%", resp: "Cust / Partner", start: "2026-04-02", end: "2026-04-02", isParent: false },
                    { id: "2.2", name: "Final Sync (File-Level, Exclude Logs)", prog: "0%", resp: "Partner / HW", start: "2026-04-02", end: "2026-04-04", isParent: false },
                    { id: "2.3", name: "Cloud Boot & Over-Provisioning (200% Compute)", prog: "0%", resp: "Partner", start: "2026-04-04", end: "2026-04-04", isParent: false },
                    { id: "2.4", name: "Technical Validation (Basis & Network)", prog: "0%", resp: "Partner", start: "2026-04-04", end: "2026-04-05", isParent: false },
                    { id: "3", name: "PHASE 2: GO-LIVE & ROLLBACK SAFETY", prog: "0%", resp: "", start: "2026-04-05", end: "2026-04-08", isParent: true },
                    { id: "3.1", name: "DNS Update & SAP Logon Switch", prog: "0%", resp: "Partner / Cust", start: "2026-04-05", end: "2026-04-05", isParent: false },
                    { id: "3.2", name: "Go-Live: 'Monday Avalanche'", prog: "0%", resp: "TAM / All", start: "2026-04-06", end: "2026-04-06", isParent: false },
                    { id: "3.3", name: "Configure Reverse Replication", prog: "0%", resp: "Partner", start: "2026-04-06", end: "2026-04-07", isParent: false }
                ]
            }
        };

        const generateDefaultProject = (id, name, isWaiting, lifecycleState, health, mrr, kickoff, date) => ({
            id, isWaiting, name, country: "TBD", health, progress: "0%", mrr, kickoff, date, sa: "John Doe", partner: "None", partnerType: "N/A", partnerLocation: "N/A", blocker: "Initial discovery.", complexity: "Medium", scope: "Advisory",
            lifecycleState: lifecycleState, 
            physics: null, physicsHistory: [], ora: null, oraHistory: [], budget: null, mapperCsv: "", mapperHistory: [], war: null,
            migrationPlan: JSON.parse(JSON.stringify(defaultPlaybooks["default_vm"].tasks)),
            apiConfig: { accessKey: "", secretKey: "", region: "la-south-2", automationEnabled: false },
            comms: { bridge: "https://teams.microsoft.com/l/meetup-join/...", chat: "", notes: "" },
            tamData: { supportPlan: "Enterprise", welinkGroup: "", tickets: [], workshops: [{id: 1, name: "Cloud Console 101", done: false}, {id: 2, name: "IAM & Security Best Practices", done: false}] }
        });

        const defaultProjects = [
          { ...generateDefaultProject(1, "AWS Data Lake Exit", false, "4_execution", "Green", 12000, "2026-03-01", "2026-04-15"), country: "Mexico", progress: "65%", complexity: "High", scope: "Hands-On", blocker: "Syncing DBs." },
          { ...generateDefaultProject(2, "Unicorn Corp SAP HANA", false, "3_planning", "Yellow", 83000, "2026-03-10", "2026-05-30"), country: "Panama", progress: "10%", complexity: "Ultra-High", scope: "Supervision", blocker: "Partner failed Dev gate. Triggering Rescue." },
          { ...generateDefaultProject(3, "Logistics Hub", false, "3_planning", "Red", 22000, "2026-03-15", "2026-04-05"), country: "Guatemala", progress: "20%", scope: "Advisory", blocker: "Budget pending approval." },
          { ...generateDefaultProject(5, "Retail POS Migration", false, "2_architecture", "Green", 34000, "2026-04-01", "2026-06-15"), country: "Chile", progress: "5%", complexity: "High", scope: "Supervision", blocker: "Discovery underway." },
          generateDefaultProject(4, "Bank of Andes", true, "1_arb", "Yellow", 45000, "", "")
        ];

        const formatShortDate = (dateStr) => {
            if (!dateStr || dateStr === 'Pending' || dateStr === 'TBD') return "TBD";
            const d = new Date(dateStr); if (isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
        };

        // ==========================================
        // 📝 REUSABLE UTILITIES & MODALS
        // ==========================================
        function EditableCell({ value, onSave, type = "text", className = "", placeholder = "" }) {
          const [isEditing, setIsEditing] = useState(false); const [editValue, setEditValue] = useState(value);
          useEffect(() => { setEditValue(value); }, [value]);
          const handleSave = () => { setIsEditing(false); if (editValue !== value) onSave(editValue); };
          const handleKeyDown = (e) => { if (e.key === 'Enter' && type !== 'textarea') handleSave(); if (e.key === 'Escape') { setIsEditing(false); setEditValue(value); } };

          if (isEditing) {
            if (type === 'textarea') return <textarea autoFocus value={editValue} onChange={e=>setEditValue(e.target.value)} onBlur={handleSave} onKeyDown={e=>{if(e.key==='Escape')handleSave()}} className={`w-full p-1 text-[10px] border border-blue-500 rounded outline-none shadow-sm ${className}`} rows={3} />
            if (type === 'select') {
                let options = placeholder === 'health' ? ['Green', 'Yellow', 'Red'] : ['Low', 'Medium', 'High', 'Ultra-High'];
                return <select autoFocus value={editValue} onChange={e=>setEditValue(e.target.value)} onBlur={handleSave} className={`w-full p-0.5 text-[10px] border border-blue-500 rounded outline-none shadow-sm ${className}`}>{options.map(opt => <option key={opt} value={opt}>{opt}</option>)}</select>
            }
            return <input autoFocus type={type} value={editValue} onChange={e=>setEditValue(e.target.value)} onBlur={handleSave} onKeyDown={handleKeyDown} className={`w-full p-0.5 text-[10px] border border-blue-500 rounded outline-none shadow-sm ${className}`} />
          }
          const displayValue = type === 'date' ? formatShortDate(value) : value;
          return <div className={`cursor-pointer hover:bg-slate-200 rounded px-1 -ml-1 inline-flex items-center group relative min-h-[8px] max-h-[16px] w-full ${className}`} onClick={() => setIsEditing(true)} title="Click to edit">{displayValue || <span className="italic text-slate-400">{placeholder || 'Edit'}</span>}<i className="fas fa-pencil-alt text-[8px] text-slate-400 ml-1 opacity-0 group-hover:opacity-100 absolute right-0 bg-slate-200 pl-1"></i></div>;
        }

        function ConfigModal({ project, onClose, onSave }) {
            const [config, setConfig] = useState(project?.apiConfig || { accessKey: "", secretKey: "", region: "la-south-2", automationEnabled: false });
            return (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full border border-slate-200 flex flex-col">
                        <div className="px-6 py-5 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-2xl"><h3 className="font-black text-base text-slate-800"><i className="fas fa-cog text-blue-600 mr-2"></i>Project Configuration</h3><button onClick={onClose} className="text-slate-400 hover:text-rose-500 text-lg"><i className="fas fa-times"></i></button></div>
                        <div className="p-6 space-y-5">
                            <div className="bg-blue-50 p-4 rounded-xl border border-blue-100 flex gap-3 items-start"><i className="fas fa-info-circle text-blue-500 mt-0.5"></i><p className="text-xs text-blue-900 leading-relaxed">Providing secure IAM credentials allows the Delivery Platform to query Destination Cloud APIs for live reconciliation.</p></div>
                            <div><label className="block text-xs font-bold text-slate-700 mb-1">Target Cloud Region</label><select value={config.region} onChange={e=>setConfig({...config, region: e.target.value})} className="w-full p-2 border rounded bg-slate-50 outline-none focus:border-blue-500"><option value="la-south-2">la-south-2 (Mexico)</option><option value="la-north-2">la-north-2 (Lima)</option><option value="sa-brazil-1">sa-brazil-1 (Sao Paulo)</option><option value="na-mexico-1">na-mexico-1 (Querétaro)</option></select></div>
                            <div><label className="block text-xs font-bold text-slate-700 mb-1">Service Account Access Key (AK)</label><input type="text" value={config.accessKey} onChange={e=>setConfig({...config, accessKey: e.target.value})} className="w-full p-2 border rounded bg-slate-50 font-mono text-xs outline-none focus:border-blue-500" placeholder="HW_XXXXXXXXXXXXXXXX" /></div>
                            <div><label className="block text-xs font-bold text-slate-700 mb-1">Service Account Secret Key (SK)</label><input type="password" value={config.secretKey} onChange={e=>setConfig({...config, secretKey: e.target.value})} className="w-full p-2 border rounded bg-slate-50 font-mono text-xs outline-none focus:border-blue-500" placeholder="••••••••••••••••••••••••••••••••" /></div>
                            <div className="pt-2"><label className="flex items-center gap-3 cursor-pointer p-3 border rounded-xl hover:bg-slate-50"><input type="checkbox" checked={config.automationEnabled} onChange={e=>setConfig({...config, automationEnabled: e.target.checked})} className="w-5 h-5 accent-emerald-500" /><div className="flex flex-col"><span className="font-bold text-sm text-slate-800">Enable Live API Reconciliation</span><span className="text-[10px] text-slate-500">Poll provider APIs to auto-update progress</span></div></label></div>
                        </div>
                        <div className="px-6 py-4 border-t border-slate-200 bg-slate-50 rounded-b-2xl flex justify-end gap-3"><button onClick={onClose} className="px-5 py-2 text-xs font-bold text-slate-600 hover:bg-slate-200 rounded-lg">Cancel</button><button onClick={()=>{onSave(config); onClose();}} className="px-5 py-2 text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow-md">Save Configuration</button></div>
                    </div>
                </div>
            )
        }

        function ExcelUploader({ onUpdateData, onClose }) {
            const [pasteData, setPasteData] = useState("");

            const handleProcess = () => {
                if (!pasteData.trim()) return;
                const rows = pasteData.split('\n').filter(row => row.trim());
                let startIndex = 0;
                if (rows.length > 0) {
                    const firstCol = rows[0].split(/[\t,]/)[0].toLowerCase().replace(/^"|"$/g, '').trim();
                    if (firstCol === 'customer' || firstCol === 'customer name') startIndex = 1;
                }
                const newProjects = [];
                for (let i = startIndex; i < rows.length; i++) {
                    let cols = rows[i].includes('\t') ? rows[i].split('\t') : rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    cols = cols.map(c => c ? c.trim().replace(/^"|"$/g, '') : "");
                    if (cols.length >= 2) {
                        newProjects.push(generateDefaultProject(
                            Date.now() + i, 
                            cols[0] || "Unnamed Project", 
                            false, 
                            "3_planning", 
                            cols[2] || "Yellow", 
                            parseFloat((cols[4] || "0").replace(/[^0-9.-]+/g,"")) || 0,
                            cols[5] || "",
                            cols[6] || ""
                        ));
                    }
                }
                if (newProjects.length > 0) { onUpdateData(newProjects); } else { alert("Could not parse data. Check formatting."); }
            };

            return (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-5xl w-full border border-slate-200 flex flex-col max-h-[90vh]">
                        <div className="px-8 py-6 border-b border-slate-200 bg-slate-50 rounded-t-2xl flex justify-between items-center">
                            <h3 className="font-black text-xl flex items-center gap-3 text-slate-800"><i className="fas fa-file-excel text-emerald-600"></i>Upload Excel / Paste Pipeline</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-rose-500 text-xsxl transition-colors"><i className="fas fa-times"></i></button>
                        </div>
                        <div className="p-8 overflow-y-auto">
                            <p className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">Paste Tab-Separated Data Here:</p>
                            <textarea value={pasteData} onChange={(e) => setPasteData(e.target.value)} placeholder="Customer | Country | Health | Progress % | MRR | KICKOFF | Target Date | Phase | SA | Partner | Type | Location | Blocker | Complexity | Scope" className="w-full h-64 p-5 border-2 border-slate-200 rounded-xl focus:border-emerald-500 font-mono text-xs outline-none bg-slate-50 whitespace-pre text-slate-700"></textarea>
                        </div>
                        <div className="px-8 py-6 border-t border-slate-200 bg-slate-50 rounded-b-2xl flex justify-end gap-4">
                            <button onClick={onClose} className="px-6 py-3 text-sm font-black text-slate-500 hover:text-slate-800 uppercase tracking-wider transition-colors">Cancel</button>
                            <button onClick={handleProcess} className="px-6 py-3 text-sm font-black bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl uppercase tracking-wider shadow-md transition-transform active:scale-95">Process Data & Update</button>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 🌍 GLOBAL VIEWS
        // ==========================================
        function GlobalDashboard({ projects, onNavigateToProject }) {
            const activeProjects = (projects || []).filter(p => p && !p.isWaiting);
            const totalMRR = activeProjects.reduce((s, p) => s + (Number(p.mrr) || 0), 0);
            const fm = (num) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(num || 0);

            const [showLifecycle, setShowLifecycle] = useState(true);
            const [selectedStage, setSelectedStage] = useState('all');

            const stages = [
                { id: '1_arb', name: 'ARB Intake', color: 'border-purple-500 text-purple-600 bg-purple-50', icon: 'fa-door-open', action: 'Approve Architecture SOW' },
                { id: '2_architecture', name: 'Architecture', color: 'border-blue-500 text-blue-600 bg-blue-50', icon: 'fa-project-diagram', action: 'Calculate Physics Engine' },
                { id: '3_planning', name: 'Planning', color: 'border-emerald-500 text-emerald-600 bg-emerald-50', icon: 'fa-tasks', action: 'Lock FinOps & WBS' },
                { id: '4_execution', name: 'Execution', color: 'border-amber-500 text-amber-600 bg-amber-50', icon: 'fa-rocket', action: 'Monitor Sync & TAM Tickets' },
                { id: '5_postlive', name: 'Post-Live', color: 'border-slate-500 text-slate-600 bg-slate-50', icon: 'fa-award', action: 'Execute WAR Sign-Off' }
            ];

            const filteredProjects = selectedStage === 'all' 
                ? activeProjects 
                : activeProjects.filter(p => p.lifecycleState === selectedStage);

            return (
                <div className="animate-fade-in max-w-[1600px] w-full mx-auto space-y-6 pb-12">
                    <div className="bg-gradient-to-r from-slate-900 to-slate-800 rounded-2xl p-8 shadow-xl text-white flex flex-col md:flex-row justify-between items-center gap-6 border border-slate-700">
                        <div>
                            <h2 className="text-3xl font-black tracking-tight mb-2">Executive Overview</h2>
                            <p className="text-sm text-slate-400 max-w-xl">Regional aggregate of delivery performance and financial forecasting.</p>
                        </div>
                        <div className="flex gap-4 items-center">
                            <button onClick={()=>setShowLifecycle(!showLifecycle)} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all border ${showLifecycle ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-800 border-slate-600 text-slate-300 hover:bg-slate-700'}`}>
                                <i className="fas fa-project-diagram mr-2"></i> Toggle Lifecycle Flow
                            </button>
                            <div className="bg-slate-800/80 backdrop-blur-sm border border-slate-600 px-8 py-4 rounded-xl shadow-inner text-center">
                                <div className="text-[10px] text-slate-400 uppercase tracking-widest font-black mb-1">Active Pipeline MRR</div>
                                <div className="text-3xl font-black text-emerald-400">{fm(totalMRR)}</div>
                            </div>
                        </div>
                    </div>

                    {showLifecycle && (
                        <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 animate-fade-in">
                            <div className="flex justify-between items-center mb-8 border-b border-slate-100 pb-4">
                                <h3 className="font-black text-lg text-slate-800"><i className="fas fa-route text-blue-500 mr-2"></i> Standard Delivery Methodology</h3>
                                {selectedStage !== 'all' && <button onClick={()=>setSelectedStage('all')} className="text-xs font-bold text-slate-500 hover:text-blue-600"><i className="fas fa-times-circle mr-1"></i> Clear Filter</button>}
                            </div>
                            
                            <div className="flex flex-col md:flex-row justify-between items-center relative gap-4 md:gap-0">
                                <div className="hidden md:block absolute top-1/2 left-10 right-10 h-1 bg-slate-200 -translate-y-1/2 z-0"></div>
                                
                                {stages.map((stage, idx) => {
                                    const stageProjects = activeProjects.filter(p => p.lifecycleState === stage.id);
                                    const stageMRR = stageProjects.reduce((s, p) => s + (Number(p.mrr) || 0), 0);
                                    const isSelected = selectedStage === stage.id;
                                    
                                    return (
                                        <div key={stage.id} onClick={()=>setSelectedStage(stage.id)} className={`relative z-10 flex flex-col items-center cursor-pointer group transition-transform ${isSelected ? 'scale-110' : 'hover:scale-105'}`}>
                                            <div className={`w-20 h-20 rounded-full flex items-center justify-center border-4 shadow-lg bg-white transition-colors ${isSelected ? stage.color : 'border-slate-200 text-slate-400 group-hover:border-slate-400'}`}>
                                                <i className={`fas ${stage.icon} text-xsxl`}></i>
                                            </div>
                                            <div className="text-center mt-4">
                                                <div className={`font-black text-sm uppercase tracking-widest ${isSelected ? 'text-slate-800' : 'text-slate-500'}`}>{stage.name}</div>
                                                <div className="flex gap-2 justify-center mt-1.5">
                                                    <span className="text-[10px] font-black bg-slate-100 px-2 py-0.5 rounded text-slate-600">{stageProjects.length} Proj</span>
                                                    <span className="text-[10px] font-black bg-emerald-50 px-2 py-0.5 rounded text-emerald-700">{fm(stageMRR)}</span>
                                                </div>
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>

                            <div className="mt-10 pt-6 border-t border-slate-100 bg-slate-50 p-6 rounded-xl">
                                <h4 className="font-black text-sm text-slate-800 mb-4 uppercase tracking-widest">

                            <div className="space-y-4">
                                {activeProjects.filter(p=>p.health==='Red').map(p => (

                            </div>
                        </div>
                        <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                            <h3 className="font-black text-sm uppercase tracking-widest text-slate-800 mb-5 flex items-center"><i className="fas fa-rocket text-emerald-500 mr-3 text-xl"></i> Imminent Go-Lives (30 Days)</h3>
                            <div className="space-y-4">

        function GeospatialMap({ projects }) {
            const mapRef = useRef(null);
            const mapInstance = useRef(null);
            const markersLayer = useRef(null);

            const countryCoords = {
                'Mexico': [23.6345, -102.5528],
                'Panama': [8.5379, -80.7821],
                'Guatemala': [15.7834, -90.2307],
                'Colombia': [4.5709, -74.2973],
                'Chile': [-35.6751, -71.5429],
                'Peru': [-9.1899, -75.0152],
                'Argentina': [-38.4161, -63.6167],
                'Brazil': [-14.2350, -51.9253],
                'Costa Rica': [9.7489, -83.7534],
                'Ecuador': [-1.8312, -78.1834]
            };

            const fm = (num) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(num || 0);

            const getBusinessUnit = (country) => {
                const multiCountry = ['Panama', 'Guatemala', 'Costa Rica', 'El Salvador', 'Honduras', 'Nicaragua', 'Dominican Republic', 'Puerto Rico'];
                if (country === 'Mexico') return 'Mexico Region';
                if (multiCountry.includes(country)) return 'Multi-Country Region';
                if (country === 'Brazil') return 'Brazil Region';
                return 'South America Region'; 
            };

            const mapData = useMemo(() => {
                const active = (projects || []).filter(p => p && !p.isWaiting);
                const aggregated = {};
                let totalMrr = 0;
                const buSet = new Set();
                
                active.forEach(p => {
                    const c = p.country || 'Unknown';
                    const bu = getBusinessUnit(c);
                    buSet.add(bu);

                    if (!countryCoords[c]) return; 
                    if (!aggregated[c]) aggregated[c] = { name: c, bu: bu, coords: countryCoords[c], projects: [], totalMrr: 0, worstHealth: 'Green' };
                    
                    aggregated[c].projects.push(p);
                    aggregated[c].totalMrr += Number(p.mrr) || 0;
                    totalMrr += Number(p.mrr) || 0;
                    
                    if (p.health === 'Red') aggregated[c].worstHealth = 'Red';
                    else if (p.health === 'Yellow' && aggregated[c].worstHealth !== 'Red') aggregated[c].worstHealth = 'Yellow';
                });
                
                return { regions: Object.values(aggregated), totalMrr, count: active.length, buCount: buSet.size };
            }, [projects]);

            useEffect(() => {
                if (typeof L === 'undefined') return;

                if (mapRef.current && !mapInstance.current) {
                    mapInstance.current = L.map(mapRef.current, { zoomControl: false, attributionControl: false }).setView([4.5709, -74.2973], 4); 
                    
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { 
                        maxZoom: 19,
                        attribution: '&copy; CartoDB'
                    }).addTo(mapInstance.current);
                    
                    L.control.zoom({ position: 'bottomright' }).addTo(mapInstance.current);
                    markersLayer.current = L.featureGroup().addTo(mapInstance.current);

                    setTimeout(() => { if(mapInstance.current) mapInstance.current.invalidateSize(); }, 250);
                }

                if (mapInstance.current && markersLayer.current) {
                    markersLayer.current.clearLayers();
                    mapData.regions.forEach(region => {
                        let coreColor = "bg-cyan-500 shadow-[0_0_12px_#06b6d4]"; let pingColor = "bg-cyan-400";
                        if (region.worstHealth === 'Red') { coreColor = "bg-rose-600 shadow-[0_0_12px_#e11d48]"; pingColor = "bg-rose-500"; }
                        else if (region.worstHealth === 'Yellow') { coreColor = "bg-amber-400 shadow-[0_0_12px_#fbbf24]"; pingColor = "bg-amber-300"; }

                        const htmlIcon = L.divIcon({
                            className: 'custom-beacon',
                            html: `<div class="relative flex items-center justify-center w-8 h-8"><span class="animate-ping absolute inline-flex h-full w-full rounded-full ${pingColor} opacity-75"></span><span class="relative inline-flex rounded-full h-3.5 w-3.5 ${coreColor} border-2 border-slate-900"></span></div>`,
                            iconSize: [32, 32], iconAnchor: [16, 16]
                        });

                        let popupHTML = `<div class="p-4 w-64"><div class="border-b border-slate-700 pb-2 mb-3"><h4 class="font-black text-sm uppercase tracking-widest text-white">${region.name}</h4><div class="text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">${region.bu}</div><div class="text-xs text-slate-400 font-bold mt-1">Aggregated MRR: <span class="text-cyan-400">${fm(region.totalMrr)}</span></div></div><div class="space-y-2 max-h-40 overflow-y-auto pr-1 custom-scrollbar">`;
                        region.projects.forEach(p => {
                            let dot = '#06b6d4'; if(p.health==='Red') dot = '#e11d48'; if(p.health==='Yellow') dot = '#fbbf24';
                            popupHTML += `<div class="bg-slate-800/80 p-2 rounded border border-slate-700 flex justify-between items-center"><div class="truncate pr-2"><div class="text-[10px] font-bold text-white flex items-center"><span class="w-2 h-2 rounded-full inline-block mr-1.5" style="background:${dot}"></span>${p.name || 'Unknown'}</div><div class="text-[8px] text-slate-400 uppercase tracking-widest mt-0.5">${p.sa || ''}</div></div><div class="text-[10px] font-black text-slate-300">${p.progress || ''}</div></div>`;
                        });
                        popupHTML += `</div></div>`;

                        L.marker(region.coords, { icon: htmlIcon }).bindPopup(popupHTML).addTo(markersLayer.current);
                    });
                }
            }, [mapData]);

            useEffect(() => {
                return () => { if (mapInstance.current) { mapInstance.current.remove(); mapInstance.current = null; } };
            }, []);

            return (
                <div className="animate-fade-in max-w-[1800px] w-full mx-auto flex flex-col lg:flex-row gap-6 lg:h-[calc(100vh-140px)] min-max-h-[800px] pb-6">
                    <div className="w-full lg:w-80 bg-slate-900 rounded-2xl shadow-xl border border-slate-800 p-6 flex flex-col text-white shrink-0 h-auto lg:h-full">
                        <h2 className="font-black text-sm uppercase tracking-widest text-slate-300 flex items-center mb-6 border-b border-slate-800 pb-4"><i className="fas fa-globe-americas text-blue-400 mr-3 text-xl"></i> Operations Node</h2>
                        <div className="space-y-6 flex-1">
                            <div className="bg-slate-800/50 p-5 rounded-2xl border border-slate-700 shadow-inner"><div className="text-[10px] uppercase tracking-widest text-slate-400 font-bold mb-2">Total Network MRR</div><div className="text-4xl font-black text-cyan-400">{fm(mapData.totalMrr)}</div></div>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-slate-800/50 p-5 rounded-2xl border border-slate-700 text-center shadow-inner"><div className="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-2">Business Units</div><div className="text-3xl font-black text-blue-300">{mapData.buCount}</div></div>
                                <div className="bg-slate-800/50 p-5 rounded-2xl border border-slate-700 text-center shadow-inner"><div className="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-2">Geographies</div><div className="text-3xl font-black text-blue-300">{mapData.regions.length}</div></div>
                            </div>
                            <div className="bg-slate-800/50 p-5 rounded-2xl border border-slate-700 text-center shadow-inner"><div className="text-[10px] uppercase tracking-widest text-slate-400 font-bold mb-2">Active Projects</div><div className="text-3xl font-black text-blue-300">{mapData.count}</div></div>

                            <div className="mt-6 pt-6 border-t border-slate-800 text-[10px] text-slate-400 uppercase tracking-widest font-bold flex flex-col gap-4">
                                <div className="flex items-center gap-3"><span className="w-3 h-3 rounded-full bg-cyan-500 shadow-[0_0_10px_#06b6d4]"></span> Region Healthy</div>
                                <div className="flex items-center gap-3"><span className="w-3 h-3 rounded-full bg-amber-400 shadow-[0_0_10px_#fbbf24]"></span> Region at Risk</div>
                                <div className="flex items-center gap-3"><span className="w-3 h-3 rounded-full bg-rose-600 shadow-[0_0_10px_#e11d48]"></span> Critical Blocker in Region</div>
                            </div>
                        </div>
                    </div>
                    <div className="flex-1 rounded-2xl shadow-xl overflow-hidden border border-slate-300 bg-slate-900 relative min-max-h-[500px] w-full flex flex-col">
                        <div ref={mapRef} className="absolute inset-0 bg-slate-950"></div>
                    </div>
                </div>
            )
        }

        function GlobalRadar({ projects, onUpdateProject, onAddProject }) {
            const waitingProjects = (projects || []).filter(p => p && p.isWaiting);
            const [newLeadName, setNewLeadName] = useState(""); const [newLeadSA, setNewLeadSA] = useState(""); const [newLeadMRR, setNewLeadMRR] = useState("");
            const [expanded, setExpanded] = useState({ prospect: true, sizing: true, ready: true });

            const handleAddNewLead = () => { if(!newLeadName || !newLeadSA) return alert("Name and SA required."); onAddProject(generateDefaultProject(Date.now(), newLeadName, true, "1_arb", "Yellow", parseFloat(newLeadMRR)||0, "", "")); setNewLeadName(""); setNewLeadSA(""); setNewLeadMRR(""); };
            const cols = [{ id: 'prospect', title: 'Early Prospect', color: 'border-slate-300 bg-slate-50' }, { id: 'sizing', title: 'Discovery & Sizing', color: 'border-blue-300 bg-blue-50/50' }, { id: 'ready', title: 'Ready for ARB Intake', color: 'border-purple-300 bg-purple-50/50' }];

            return (
                <div className="animate-fade-in max-w-[1800px] w-full mx-auto space-y-6 pb-12">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap items-end gap-5">
                        <div><label className="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Customer Lead</label><input type="text" value={newLeadName} onChange={e=>setNewLeadName(e.target.value)} className="p-3 border-2 border-slate-200 rounded-xl text-sm w-64 bg-slate-50 outline-none focus:border-blue-500 font-bold" placeholder="GlobalCorp Migration" /></div>
                        <div><label className="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Sales Architect</label><input type="text" value={newLeadSA} onChange={e=>setNewLeadSA(e.target.value)} className="p-3 border-2 border-slate-200 rounded-xl text-sm w-48 bg-slate-50 outline-none focus:border-blue-500 font-bold" placeholder="SA Name" /></div>
                        <div><label className="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Est. MRR ($)</label><input type="number" value={newLeadMRR} onChange={e=>setNewLeadMRR(e.target.value)} className="p-3 border-2 border-slate-200 rounded-xl text-sm w-32 bg-slate-50 outline-none focus:border-blue-500 font-bold" placeholder="0" /></div>
                        <button onClick={handleAddNewLead} className="px-8 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-black uppercase tracking-widest rounded-xl shadow-md text-xs transition-colors"><i className="fas fa-plus mr-2"></i> Add to Radar</button>
                    </div>
                    
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {cols.map(col => {
                            const colProjects = waitingProjects.filter(p => p.waitingStage === col.id || (col.id==='prospect' && !p.waitingStage));
                            return (
                                <div key={col.id} className={`rounded-2xl border-2 flex flex-col transition-all duration-300 overflow-hidden ${col.color} ${expanded[col.id] ? 'h-auto lg:max-h-[700px]' : 'h-16'}`}>
                                    <div className="p-5 border-b-2 border-inherit font-black text-sm text-slate-800 uppercase tracking-widest bg-white/60 backdrop-blur-sm flex justify-between items-center cursor-pointer hover:bg-white/80 transition-colors" onClick={() => setExpanded(prev => ({...prev, [col.id]: !prev[col.id]}))}>
                                        <div className="flex items-center">
                                            {col.title} 
                                            <span className="ml-3 bg-slate-800 text-white px-3 py-1 rounded-full text-[10px] shadow-sm">{colProjects.length}</span>
                                        </div>
                                        <i className={`fas fa-chevron-${expanded[col.id] ? 'up' : 'down'} text-slate-400 text-lg`}></i>
                                    </div>
                                    <div className={`p-5 space-y-5 overflow-y-auto flex-1 custom-scrollbar ${!expanded[col.id] ? 'hidden' : 'block'}`}>
                                        {colProjects.map(p => (
                                            <div key={p.id} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm group hover:shadow-md transition-all">
                                                <div className="font-black text-base text-slate-800 leading-tight mb-3"><EditableCell value={p.name} onSave={v=>onUpdateProject(p.id,'name',v)} /></div>
                                                <div className="text-xs font-bold text-blue-600 uppercase tracking-widest flex items-center mb-4"><i className="fas fa-user-tie mr-2 opacity-50"></i> <EditableCell value={p.sa} onSave={v=>onUpdateProject(p.id,'sa',v)} /></div>
                                                <div className="text-sm font-black bg-emerald-50 text-emerald-800 w-max px-4 py-1.5 rounded-lg border border-emerald-200 flex items-center shadow-sm"><span className="mr-1 text-emerald-500">$</span><EditableCell value={p.mrr} type="number" onSave={v=>onUpdateProject(p.id,'mrr',v)} /></div>
                                                <div className="text-xs text-slate-600 mt-4 p-3 bg-slate-50 rounded-xl border border-slate-100 font-medium"><EditableCell type="textarea" value={p.blocker} onSave={v=>onUpdateProject(p.id,'blocker',v)} /></div>
                                                <div className="mt-4 pt-4 border-t border-slate-100 flex justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                    {col.id === 'prospect' && <button onClick={()=>onUpdateProject(p.id, 'waitingStage', 'sizing')} className="text-[10px] font-black uppercase tracking-widest bg-blue-100 text-blue-800 hover:bg-blue-200 px-4 py-2 rounded-lg transition-colors">Move <i className="fas fa-arrow-right ml-1"></i></button>}
                                                    {col.id === 'sizing' && <button onClick={()=>onUpdateProject(p.id, 'waitingStage', 'ready')} className="text-[10px] font-black uppercase tracking-widest bg-purple-100 text-purple-800 hover:bg-purple-200 px-4 py-2 rounded-lg transition-colors">Ready <i className="fas fa-arrow-right ml-1"></i></button>}
                                                    {col.id === 'ready' && <button onClick={()=>{onUpdateProject(p.id, 'isWaiting', false); alert("Moved to Pipeline!");}} className="text-[10px] font-black uppercase tracking-widest bg-emerald-600 text-white hover:bg-emerald-700 px-4 py-2 rounded-lg shadow-md transition-colors">Start ARB <i className="fas fa-door-open ml-1"></i></button>}
                                                </div>
                                            </div>
                                        ))}
                                        {colProjects.length === 0 && <div className="text-center text-slate-400 text-xs font-bold py-12 border-2 border-dashed border-slate-300 rounded-2xl mx-2">No active leads</div>}
                                    </div>
                                </div>
                            )
                        })}

                </div>
            )
        }

        function GlobalPipeline({ projects, onUpdateProject, onExport, onImport }) {
          const activeProjects = (projects || []).filter(p => p && !p.isWaiting);
          const fm = (num) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(num || 0);
          
          const [menuOpen, setMenuOpen] = useState(false);

          const getHealthBadge = (h) => { if(h==='Green') return <span className="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded text-[9px] font-bold border border-emerald-200"><i className="fas fa-check-circle"></i> On Track</span>; if(h==='Red') return <span className="bg-rose-100 text-rose-800 px-2 py-0.5 rounded text-[9px] font-bold border border-rose-200"><i className="fas fa-times-circle"></i> Blocked</span>; return <span className="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-[9px] font-bold border border-amber-200"><i className="fas fa-clock"></i> At Risk</span>; };
          const getStateLabel = (s) => { const map = {'1_arb':'1. ARB Intake', '2_architecture':'2. Architecture', '3_planning':'3. Planning', '4_execution':'4. Execution', '5_postlive':'5. Post-Live'}; return map[s] || s; };

          // Executive Sales Report logic
          const handleSalesExport = () => {
              const headers = ["Customer", "Country", "Phase", "Go-Live Date", "Target MRR", "Overall Health", "Executive Summary"];
              const csvContent = [headers.join(","), ...activeProjects.map(p => { 
                  let execSummary = p.health === 'Green' ? "On track for standard delivery." : p.health === 'Yellow' ? "Minor delays, actively managed." : `Critical blocker escalated: ${(p.blocker || '').replace(/"/g, '""')}`;
                  let status = getStateLabel(p.lifecycleState).replace(/[0-9]. /g, '');
                  return [`"${(p.name || '').replace(/"/g, '""')}"`, `"${(p.country || '').replace(/"/g, '""')}"`, `"${status}"`, `"${formatShortDate(p.date)}"`, `"${fm(p.mrr)}"`, `"${p.health || ''}"`, `"${execSummary}"`].join(","); 
              })].join("\n");
              
              const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }); 
              const url = URL.createObjectURL(blob);
              const link = document.createElement("a"); 
              link.setAttribute("href", url); 
              link.setAttribute("download", `Sales_Exec_Pipeline_${new Date().toISOString().split('T')[0]}.csv`); 
              document.body.appendChild(link); link.click(); document.body.removeChild(link);
          };

          return (
            <div className="animate-fade-in max-w-[2000px] w-full mx-auto pb-12">
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col min-max-h-[600px]">
                <div className="px-6 py-5 border-b border-slate-200 bg-slate-900 text-white flex flex-wrap gap-4 justify-between items-center">
                  <h3 className="font-black text-lg tracking-wide"><i className="fas fa-list-alt text-emerald-400 mr-2"></i> Master Execution Pipeline</h3>
                  <div className="flex gap-3 items-center flex-wrap relative">
                      <button onClick={()=>setMenuOpen(!menuOpen)} className="w-10 h-10 flex items-center justify-center bg-slate-800 hover:bg-slate-700 text-white rounded-xl shadow-md transition-colors border border-slate-600 focus:outline-none">
                          <i className="fas fa-ellipsis-v"></i>
                      </button>
                      {menuOpen && (
                          <div className="absolute top-full mt-2 right-0 w-64 bg-white rounded-xl shadow-xl border border-slate-200 overflow-hidden z-50 animate-fade-in">
                              <button onClick={()=>{onImport(); setMenuOpen(false);}} className="w-full text-left px-4 py-3 text-xs font-bold text-slate-700 hover:bg-slate-50 border-b border-slate-100 transition-colors">
                                  <i className="fas fa-upload text-emerald-500 w-5 text-center"></i> Import Pipeline Data
                              </button>
                              <button onClick={()=>{onExport(); setMenuOpen(false);}} className="w-full text-left px-4 py-3 text-xs font-bold text-slate-700 hover:bg-slate-50 border-b border-slate-100 transition-colors">
                                  <i className="fas fa-code text-slate-500 w-5 text-center"></i> Export Technical Schema
                              </button>
                              <button onClick={()=>{handleSalesExport(); setMenuOpen(false);}} className="w-full text-left px-4 py-3 text-xs font-bold text-slate-700 hover:bg-blue-50 bg-blue-50/50 transition-colors">
                                  <i className="fas fa-file-invoice text-blue-500 w-5 text-center"></i> Export Sales Summary
                              </button>
                          </div>
                      )}
                  </div>
                </div>
                <div className="overflow-x-auto w-full bg-slate-50 flex-1">
                  <table className="w-full max-w-[1600px] w-full text-left border-collapse">
                    <thead className="bg-slate-200 text-slate-600 text-[10px] uppercase border-b-2 border-slate-300 tracking-wider">
                      <tr>

        function GlobalSchedule({ projects }) {
            const timelineProjects = useMemo(() => {
                const valid = []; (projects||[]).filter(p => p && !p.isWaiting).forEach(p => { 
                    const start = new Date(p.kickoff); const end = new Date(p.date); 
                    if(!isNaN(start.getTime()) && !isNaN(end.getTime()) && end > start) valid.push({ ...p, startObj: start, endObj: end }); 
                });
                return valid.sort((a,b) => a.startObj - b.startObj);
            }, [projects]);

            const bounds = useMemo(() => { if(timelineProjects.length === 0) return null; let min = timelineProjects[0].startObj.getTime(); let max = timelineProjects[0].endObj.getTime(); timelineProjects.forEach(p => { if(p.startObj.getTime() < min) min = p.startObj.getTime(); if(p.endObj.getTime() > max) max = p.endObj.getTime(); }); const pad = 15 * 24 * 60 * 60 * 1000; return { min: min - pad, max: max + pad, total: Math.max((max+pad) - (min-pad), 1) }; }, [timelineProjects]);
            const getLeftPos = (d) => ((d.getTime() - bounds.min) / bounds.total) * 100;
            const getWidth = (s, e) => ((e.getTime() - s.getTime()) / bounds.total) * 100;
            
            return (
                <div className="animate-fade-in max-w-[1800px] w-full mx-auto space-y-6 pb-12">
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 flex flex-col">
                        <h3 className="font-black text-xl text-slate-800 mb-8 flex items-center"><i className="fas fa-stream text-emerald-500 mr-3"></i> Global Delivery Schedule (Gantt)</h3>
                        {timelineProjects.length===0 ? <div className="p-12 text-center text-slate-400 font-bold border-2 border-dashed rounded-xl bg-slate-50">No valid dates in pipeline. Ensure dates are chosen via calendar picker.</div> : (
                            <div className="overflow-x-auto w-full">
                                <div className="min-max-w-[1000px] w-full relative min-max-h-[400px]">
                                    <div className="absolute inset-0 flex justify-between pl-64 opacity-20 pointer-events-none">{[...Array(8)].map((_, i) => <div key={i} className="h-full border-l-2 border-dashed border-slate-400"></div>)}</div>
                                    <div className="space-y-6 relative z-10 pt-4">
                                        {timelineProjects.map(p => (
                                            <div key={p.id} className="flex items-center group">
                                                <div className="w-64 shrink-0 pr-4 border-2 border-slate-200"><div className="font-black text-xs text-slate-800 truncate">{p.name}</div><div className="text-[9px] font-bold text-slate-500 uppercase tracking-widest mt-1">{p.sa}</div></div>
                                                <div className="flex-1 h-10 relative bg-slate-50 border-y border-r border-transparent group-hover:bg-slate-100 transition-colors rounded-r-lg">
                                                    <div className="absolute text-[10px] font-black text-slate-500 top-1/2 -translate-y-1/2 -translate-x-full pr-2" style={{ left: `${getLeftPos(p.startObj)}%` }}>{formatShortDate(p.kickoff)}</div>
                                                    <div className={`absolute top-1 bottom-1 rounded-md shadow-md border-2 flex flex-col justify-center px-3 overflow-hidden transition-transform hover:scale-[1.02] cursor-pointer ${p.health === 'Green' ? 'bg-emerald-500 border-emerald-600 text-white' : p.health === 'Red' ? 'bg-rose-500 border-rose-600 text-white' : 'bg-amber-400 border-amber-500 text-slate-900'}`} style={{ left: `${getLeftPos(p.startObj)}%`, width: `${getWidth(p.startObj, p.endObj)}%`, minWidth:'50px'}}>
                                                        <div className="flex justify-between items-center w-full"><span className="text-[10px] font-black">{p.progress}</span></div>
                                                    </div>
                                                    <div className="absolute text-[10px] font-black text-slate-800 top-1/2 -translate-y-1/2 pl-2" style={{ left: `${getLeftPos(p.startObj) + getWidth(p.startObj, p.endObj)}%` }}>{formatShortDate(p.date)}</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            )
        }

                setSelectedKey(key);

            const handleTaskUpdate = (taskId, field, value) => {
                const updatedTasks = (activePlaybook.tasks || []).map(t => t.id === taskId ? {...t, [field]: value} : t);
